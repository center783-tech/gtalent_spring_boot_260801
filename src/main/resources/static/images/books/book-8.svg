<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 533" width="100%" height="100%">
  <!-- 背景與封面 -->
  <rect width="400" height="533" fill="#222035" />
  
  <!-- 左側書脊條 -->
  <rect x="0" y="0" width="28" height="533" fill="#3D385A" />
  
  <!-- 右上角圖案：八角星形與圓形結合 -->
  <g transform="translate(310, 125)">
    <!-- 外層圓形 -->
    <circle cx="0" cy="0" r="80" fill="#3D385A" />
    <!-- 內層四角星芒 -->
    <path d="M 0,-48 Q 0,0 48,0 Q 0,0 0,48 Q 0,0 -48,0 Q 0,0 0,-48 Z" fill="#ECA852" />
  </g>

  <!-- 中間橫線 -->
  <line x1="68" y1="308" x2="334" y2="308" stroke="#ECA852" stroke-width="4" stroke-linecap="round" />

  <!-- 左下角短橫線 -->
  <line x1="68" y1="453" x2="148" y2="453" stroke="#A97E4A" stroke-width="6" stroke-linecap="round" />
  <line x1="68" y1="469" x2="121" y2="469" stroke="#665B67" stroke-width="6" stroke-linecap="round" />
</svg>
