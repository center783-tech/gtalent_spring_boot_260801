<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重設密碼</title>
    <link rel="stylesheet" href="/css/shop.css">
</head>
<body class="auth-page">
<header class="auth-top">
    <div class="inner">
        <a class="brand" href="/page/login"><svg viewBox="0 0 32 32" aria-hidden="true" width="34" height="34"><rect x="4" y="3" width="24" height="26" rx="3" fill="#3f6b52"/><path d="M10 3v26" stroke="#fff" stroke-width="2"/><path d="M14 10h9M14 15h9" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg><span>BookShop</span></a>
        <a class="help" href="/page/login">登入</a>
    </div>
</header>

<main class="auth-hero">
    <div class="auth-card">
        <h1>重設密碼</h1>
        <p id="message" class="message" role="status"></p>
        <p id="error" class="error" role="alert" th:style="${tokenValid} ? '' : 'display: block;'"
           th:text="${tokenValid} ? '' : '重設密碼連結無效或已過期'"></p>

        <form id="resetPasswordForm" th:style="${tokenValid} ? '' : 'display: none;'">
            <div class="field">
                <label for="password">新密碼</label>
                <input id="password" class="input" name="password" type="password" minlength="6" maxlength="12" autocomplete="new-password" required>
            </div>

            <div class="field">
                <label for="confirmPassword">確認新密碼</label>
                <input id="confirmPassword" class="input" name="confirmPassword" type="password" autocomplete="new-password" required>
            </div>

            <button id="resetButton" class="btn btn-primary" type="button">重設密碼</button>
        </form>

        <div class="auth-links">
            <a href="/page/login">回登入頁</a>
        </div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token") || "";

    $("#resetButton").on("click", function () {
        $("#message").hide();
        $("#error").hide();
        $("#resetButton").prop("disabled", true).text("重設中");

        const payload = {
            token: token,
            password: $("#password").val(),
            confirmPassword: $("#confirmPassword").val()
        };

        $.ajax({
            url: "/members/reset-password",
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify(payload),
            success: function (data) {
                $("#message").text(data.message || "密碼重設成功，請重新登入").show();
                $("#resetPasswordForm").hide();
            },
            error: function (xhr) {
                const data = xhr.responseJSON || {};
                $("#error").text(data.message || "重設失敗").show();
            },
            complete: function () {
                $("#resetButton").prop("disabled", false).text("重設密碼");
            }
        });
    });
</script>
</body>
</html>
