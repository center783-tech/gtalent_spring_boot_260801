<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>創立帳號</title>
    <link rel="stylesheet" href="/css/shop.css">
</head>
<body class="auth-page">
<header class="auth-top">
    <div class="inner">
        <a class="brand" href="/"><svg viewBox="0 0 32 32" aria-hidden="true" width="34" height="34"><rect x="4" y="3" width="24" height="26" rx="3" fill="#3f6b52"/><path d="M10 3v26" stroke="#fff" stroke-width="2"/><path d="M14 10h9M14 15h9" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg><span>BookShop</span></a>
        <a class="help" href="/page/login">登入</a>
    </div>
</header>

<main class="auth-hero">
    <div class="auth-card wide">
        <h1>創立帳號</h1>
        <p class="lead">請填入基本資料完成註冊，帳號建立後就可以直接登入使用。</p>

        <p id="message" class="message" role="status"></p>
        <p id="error" class="error" role="alert"></p>

        <form id="registerForm">
            <div class="field">
                <label for="name">姓名</label>
                <input id="name" class="input" name="name" type="text" maxlength="30" autocomplete="name" required>
            </div>

            <div class="two-col">
                <div class="field">
                    <label for="account">帳號</label>
                    <input id="account" class="input" name="account" type="text" maxlength="30" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="gender">性別</label>
                    <select id="gender" class="input" name="gender" required>
                        <option value="">請選擇</option>
                        <option value="0">女性</option>
                        <option value="1">男性</option>
                        <option value="2">其他</option>
                    </select>
                </div>
            </div>

            <div class="field">
                <label for="email">電子郵件</label>
                <input id="email" class="input" name="email" type="email" maxlength="128" placeholder="name@example.com" autocomplete="email">
            </div>

            <div class="two-col">
                <div class="field">
                    <label for="password">密碼</label>
                    <input id="password" class="input" name="password" type="password" minlength="6" maxlength="12" autocomplete="new-password" required>
                    <p class="hint">密碼長度需介於 6 到 12 個字元。</p>
                </div>
                <div class="field">
                    <label for="confirmPassword">確認密碼</label>
                    <input id="confirmPassword" class="input" name="confirmPassword" type="password" minlength="6" maxlength="12" autocomplete="new-password" required>
                </div>
            </div>

            <button id="registerButton" class="btn btn-primary" type="button">建立帳號</button>
        </form>

        <div class="auth-links">
            <a href="/page/login">已有帳號，回登入頁</a>
        </div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    $("#registerButton").on("click", function () {
        $("#message").hide();
        $("#error").hide();

        const password = $("#password").val();
        const confirmPassword = $("#confirmPassword").val();

        if (password !== confirmPassword) {
            $("#error").text("密碼與確認密碼不一致").show();
            return;
        }

        $("#registerButton").prop("disabled", true).text("建立中...");

        const payload = {
            name: $("#name").val().trim(),
            account: $("#account").val().trim(),
            password: password,
            confirmPassword: confirmPassword,
            email: $("#email").val().trim(),
            gender: Number($("#gender").val())
        };

        $.ajax({
            url: "/members/register",
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify(payload),
            success: function (data) {
                $("#message").text(data.message || "帳號建立成功，稍後將前往登入頁。").show();
                $("#registerForm")[0].reset();
                setTimeout(function () {
                    window.location.href = "/page/login";
                }, 1200);
            },
            error: function (xhr) {
                const data = xhr.responseJSON || {};
                $("#error").text(data.message || "帳號建立失敗").show();
            },
            complete: function () {
                $("#registerButton").prop("disabled", false).text("建立帳號");
            }
        });
    });
</script>
</body>
</html>
