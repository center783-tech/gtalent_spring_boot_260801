<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>購物車</title>
    <link rel="stylesheet" href="/css/shop.css">
</head>
<body>
<header>
    <div class="bar">
        <h1>購物車</h1>
        <nav class="bar-actions">
            <a href="/page/books">繼續購物</a>
            <a href="/page/orders">我的訂單</a>
            <a href="/page/profile">會員資料</a>
        </nav>
    </div>
</header>

<main>
    <p id="message" class="message" role="status" hidden></p>

    <div id="loading" class="empty"><p>讀取中</p></div>

    <div id="empty" class="empty" hidden>
        <p>購物車目前是空的</p>
        <a href="/page/books">去逛逛書籍</a>
    </div>

    <div id="cartContent" hidden>
        <table>
            <thead>
            <tr>
                <th>書籍</th>
                <th class="num">單價</th>
                <th>數量</th>
                <th class="num">小計</th>
                <th></th>
            </tr>
            </thead>
            <tbody id="cartBody"></tbody>
        </table>

        <div class="summary">
            <span id="totalQuantity" class="summary-text"></span>
            <span id="totalAmount" class="total"></span>
            <button id="checkoutButton" class="checkout-button" type="button" disabled>前往結帳</button>
        </div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    function getAccessToken() { return localStorage.getItem("accessToken"); }
    function getRefreshToken() { return localStorage.getItem("refreshToken"); }

    // 後端若在 header 帶回新的 token，就存回 localStorage（與其他頁面相同）。
    function saveNewTokens(xhr) {
        const newAccessToken = xhr.getResponseHeader("X-New-Access-Token");
        const newRefreshToken = xhr.getResponseHeader("X-New-Refresh-Token");
        if (newAccessToken) { localStorage.setItem("accessToken", newAccessToken); }
        if (newRefreshToken) { localStorage.setItem("refreshToken", newRefreshToken); }
    }

    // 統一處理需要登入的 AJAX 請求，自動補上 access token 和 refresh token。
    function apiAjax(options) {
        const accessToken = getAccessToken();
        const refreshToken = getRefreshToken();

        if (!accessToken || !refreshToken) {
            window.location.href = "/page/login";
            return null;
        }

        const ajaxOptions = $.extend({}, options);
        ajaxOptions.headers = $.extend({}, options.headers || {}, {
            Authorization: `Bearer ${accessToken}`,
            "X-Refresh-Token": refreshToken
        });

        return $.ajax(ajaxOptions);
    }

    // 從後端錯誤回應取出要顯示給使用者的訊息。
    function getErrorMessage(xhr, fallback) {
        const data = xhr.responseJSON || {};
        if (data.errors && typeof data.errors === "object") {
            const first = Object.values(data.errors)[0];
            if (first) {
                return first;
            }
        }
        return data.message || fallback;
    }

    function formatMoney(value) {
        return "NT$ " + Number(value).toLocaleString();
    }

    function showMessage(text, isError) {
        $("#message").text(text).toggleClass("error", !!isError).prop("hidden", false);
    }

    function hideMessage() {
        $("#message").prop("hidden", true);
    }

    // 共用的請求流程：成功就用回傳的購物車重畫畫面；失敗顯示原因並重新讀取最新內容。
    function sendCartRequest(options, errorFallback) {
        const request = apiAjax(options);
        if (!request) {
            return;
        }

        request
            .done(function (cart, textStatus, xhr) {
                saveNewTokens(xhr);
                renderCart(cart);
            })
            .fail(function (xhr) {
                saveNewTokens(xhr);
                if (xhr.status === 401) {
                    window.location.href = "/page/login";
                    return;
                }
                loadCart(getErrorMessage(xhr, errorFallback));
            });
    }

    // 讀取購物車；errorToShow 有值時，在畫面重畫後顯示這段錯誤訊息。
    function loadCart(errorToShow) {
        const request = apiAjax({ url: "/cart", method: "GET" });
        if (!request) {
            return;
        }

        request
            .done(function (cart, textStatus, xhr) {
                saveNewTokens(xhr);
                renderCart(cart);
                if (errorToShow) {
                    showMessage(errorToShow, true);
                }
            })
            .fail(function (xhr) {
                saveNewTokens(xhr);
                if (xhr.status === 401) {
                    window.location.href = "/page/login";
                    return;
                }
                $("#loading").prop("hidden", true);
                showMessage(getErrorMessage(xhr, "讀取購物車失敗"), true);
            });
    }

    function renderCart(cart) {
        $("#loading").prop("hidden", true);

        const items = cart.items || [];
        if (items.length === 0) {
            $("#cartContent").prop("hidden", true);
            $("#empty").prop("hidden", false);
            return;
        }

        const body = $("#cartBody").empty();
        items.forEach(function (item) {
            const row = $("<tr>").toggleClass("unavailable", !item.available);

            // 書籍欄：縮圖 + 書名連結；庫存不夠或已下架時在下方標示原因。
            const nameCell = $("<td>");
            const bookCell = $("<div>", { class: "book-cell" });
            bookCell.append($("<img>", {
                class: "book-thumb",
                src: `/images/books/book-${item.bookId}.svg`,
                alt: ""
            }).on("error", function () { $(this).hide(); }));

            const nameBox = $("<div>", { class: "book-name" });
            if (item.stock > 0 || item.price > 0) {
                nameBox.append($("<a>", {
                    href: `/page/book-detail?id=${encodeURIComponent(item.bookId)}`,
                    text: item.name
                }));
            } else {
                nameBox.text(item.name);
            }
            if (!item.available) {
                const note = item.stock > 0 ? `庫存只剩 ${item.stock} 本，請調整數量` : (item.price > 0 ? "已售完" : "此書已下架，請移除");
                nameBox.append($("<span>", { class: "stock-note", text: note }));
            }
            bookCell.append(nameBox);
            nameCell.append(bookCell);

            const qtyInput = $("<input>", {
                type: "number",
                class: "qty-input",
                min: 1,
                max: Math.max(item.stock, 1),
                value: item.quantity,
                "aria-label": item.name + " 數量"
            }).attr("data-book-id", item.bookId).attr("data-original", item.quantity);

            const removeButton = $("<button>", {
                type: "button",
                class: "remove-button",
                text: "移除"
            }).attr("data-book-id", item.bookId);

            row.append(nameCell)
                .append($("<td>", { class: "num", text: formatMoney(item.price) }))
                .append($("<td>").append(qtyInput))
                .append($("<td>", { class: "num", text: formatMoney(item.subtotal) }))
                .append($("<td>").append(removeButton));
            body.append(row);
        });

        $("#totalQuantity").text(`共 ${cart.totalQuantity} 本`);
        $("#totalAmount").text(formatMoney(cart.totalAmount));
        $("#checkoutButton")
            .prop("disabled", !cart.checkoutAllowed)
            .text("前往結帳");

        $("#empty").prop("hidden", true);
        $("#cartContent").prop("hidden", false);
    }

    // 修改數量：輸入完成（change）時才送出，並檢查必須是 1 以上的整數。
    $("#cartBody").on("change", ".qty-input", function () {
        const input = $(this);
        const bookId = input.attr("data-book-id");
        const quantity = parseInt(input.val(), 10);

        hideMessage();
        if (!Number.isInteger(quantity) || quantity < 1) {
            input.val(input.attr("data-original"));
            showMessage("數量必須是 1 以上的整數", true);
            return;
        }

        sendCartRequest({
            url: `/cart/items/${encodeURIComponent(bookId)}`,
            method: "PUT",
            contentType: "application/json",
            data: JSON.stringify({ quantity: quantity })
        }, "修改數量失敗");
    });

    $("#cartBody").on("click", ".remove-button", function () {
        hideMessage();
        sendCartRequest({
            url: `/cart/items/${encodeURIComponent($(this).attr("data-book-id"))}`,
            method: "DELETE"
        }, "移除失敗");
    });

    // 結帳：整個購物車合成一張訂單、一筆付款，再導向藍新付款頁。
    $("#checkoutButton").on("click", function () {
        const button = $(this);
        hideMessage();
        button.prop("disabled", true).text("建立訂單中");

        const request = apiAjax({ url: "/payments/cart/newebpay/form", method: "POST" });
        if (!request) {
            return;
        }

        request
            .done(function (paymentForm, textStatus, xhr) {
                saveNewTokens(xhr);
                submitNewebPayForm(paymentForm);
            })
            .fail(function (xhr) {
                saveNewTokens(xhr);
                if (xhr.status === 401) {
                    window.location.href = "/page/login";
                    return;
                }
                // 庫存不足、書籍已下架等原因：顯示原因，並重新讀取最新的購物車內容。
                loadCart(getErrorMessage(xhr, "結帳失敗"));
            });
    });

    // 藍新 MPG 需要瀏覽器用 form POST 導向 gateway；表單資料本身由前一步 AJAX 取得。
    function submitNewebPayForm(paymentForm) {
        if (!paymentForm.gatewayUrl || !paymentForm.merchantId
                || !paymentForm.version || !paymentForm.tradeInfo || !paymentForm.tradeSha) {
            loadCart("付款表單資料不完整");
            return;
        }

        const form = $("<form>", {
            method: "POST",
            action: paymentForm.gatewayUrl
        }).css("display", "none");

        const fields = {
            MerchantID: paymentForm.merchantId,
            Version: paymentForm.version,
            TradeInfo: paymentForm.tradeInfo,
            TradeSha: paymentForm.tradeSha
        };

        $.each(fields, function (name, value) {
            form.append($("<input>", { type: "hidden", name: name, value: value }));
        });

        form.appendTo(document.body);
        form.trigger("submit");
    }

    $(function () {
        loadCart();
    });
</script>
</body>
</html>
