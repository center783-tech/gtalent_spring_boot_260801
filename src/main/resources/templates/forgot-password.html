<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘記密碼</title>
    <link rel="stylesheet" href="/css/shop.css">
</head>
<body class="auth-page">
<header class="auth-top">
    <div class="inner">
        <a class="brand" href="/page/login"><svg viewBox="0 0 32 32" aria-hidden="true" width="34" height="34"><rect x="4" y="3" width="24" height="26" rx="3" fill="#3f6b52"/><path d="M10 3v26" stroke="#fff" stroke-width="2"/><path d="M14 10h9M14 15h9" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg><span>BookShop</span></a>
        <a class="help" href="/page/login">登入</a>
    </div>
</header>

<main class="auth-hero">
    <div class="auth-card">
        <h1>忘記密碼</h1>
        <p class="lead">輸入帳號或 email。若帳號存在，系統會寄送重設密碼連結。</p>
        <p id="message" class="message" role="status"></p>
        <p id="error" class="error" role="alert"></p>

        <form id="forgotPasswordForm">
            <div class="field">
                <label for="accountOrEmail">帳號或 email</label>
                <input id="accountOrEmail" class="input" name="accountOrEmail" type="text" required>
            </div>

            <button id="sendButton" class="btn btn-primary" type="button">寄送重設密碼信</button>
        </form>

        <div class="auth-links">
            <a href="/page/login">回登入頁</a>
        </div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    $("#sendButton").on("click", function () {
        $("#message").hide();
        $("#error").hide();
        $("#sendButton").prop("disabled", true).text("寄送中");

        const payload = {
            accountOrEmail: $("#accountOrEmail").val().trim()
        };

        $.ajax({
            url: "/members/forgot-password",
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify(payload),
            success: function (data) {
                $("#message").text(data.message || "若帳號存在，將寄送重設密碼信").show();
                $("#forgotPasswordForm")[0].reset();
            },
            error: function (xhr) {
                const data = xhr.responseJSON || {};
                $("#error").text(data.message || "寄送失敗").show();
            },
            complete: function () {
                $("#sendButton").prop("disabled", false).text("寄送重設密碼信");
            }
        });
    });
</script>
</body>
</html>
