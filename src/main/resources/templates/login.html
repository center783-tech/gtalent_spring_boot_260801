<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員登入</title>
    <link rel="stylesheet" href="/css/shop.css">
</head>
<body class="auth-page">
<header class="auth-top">
    <div class="inner">
        <a class="brand" href="/page/login"><svg viewBox="0 0 32 32" aria-hidden="true" width="34" height="34"><rect x="4" y="3" width="24" height="26" rx="3" fill="#3f6b52"/><path d="M10 3v26" stroke="#fff" stroke-width="2"/><path d="M14 10h9M14 15h9" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg><span>BookShop</span></a>
        <a class="help" href="/page/register">註冊</a>
    </div>
</header>

<main class="auth-hero">
    <div class="auth-card">
        <h1>會員登入</h1>
        <p id="error" class="error" role="alert"></p>

        <form id="loginForm">
            <div class="field">
                <label for="account">帳號</label>
                <input id="account" class="input" name="account" type="text" autocomplete="username" required>
            </div>

            <div class="field">
                <label for="password">密碼</label>
                <input id="password" class="input" name="password" type="password" autocomplete="current-password" required>
            </div>

            <button id="loginButton" class="btn btn-primary" type="button">登入</button>
        </form>

        <div class="auth-links">
            <a href="/page/forgot-password">忘記密碼？</a>
            <a href="/page/register">沒有帳號？立即註冊</a>
        </div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    // 監聽登入按鈕的 click 事件。
    // 初學者可以先理解成：「按鈕被點擊後，就執行下面這段登入流程」。
    $("#loginButton").on("click", function () {
        // 每次重新登入前，先把上一個錯誤訊息隱藏。
        $("#error").hide();

        // 登入請求送出後，先停用按鈕並改成「登入中」。
        // 這樣可以避免使用者連續點擊，造成重複送出登入請求。
        $("#loginButton").prop("disabled", true).text("登入中");

        // 組成要送給後端的登入資料。
        // account 使用 trim() 去掉前後空白，避免使用者不小心多打一個空格。
        const payload = {
            account: $("#account").val().trim(),
            password: $("#password").val()
        };

        // 使用 AJAX 呼叫登入 API。
        // contentType: "application/json" 代表這次送出的資料格式是 JSON。
        $.ajax({
            url: "/members/login",
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify(payload),
            success: function (data) {
                // 登入成功後，後端會回傳 access token 和 refresh token。
                // 把 token 存在 localStorage，之後進入書籍頁時才能帶著 token 呼叫 API。
                localStorage.setItem("accessToken", data.accessToken);
                localStorage.setItem("refreshToken", data.refreshToken);

                // 登入成功後導向書籍列表頁。
                window.location.href = "/page/books";
            },
            error: function (xhr) {
                // 登入失敗時，優先顯示後端回傳的錯誤訊息。
                // 如果後端沒有 message，就顯示預設的「登入失敗」。
                const data = xhr.responseJSON || {};
                $("#error").text(data.message || "登入失敗").show();
            },
            complete: function () {
                // complete 不管成功或失敗都會執行。
                // 如果登入失敗，按鈕會恢復可點擊；如果登入成功，頁面會跳轉到書籍列表。
                $("#loginButton").prop("disabled", false).text("登入");
            }
        });
    });
</script>
</body>
</html>
