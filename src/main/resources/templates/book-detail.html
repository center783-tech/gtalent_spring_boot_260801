<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>書籍介紹</title>
    <link rel="stylesheet" href="/css/shop.css">
</head>
<body>
<header>
    <div class="bar">
        <h1>書籍介紹</h1>
        <div class="bar-actions">
            <a href="/page/books">回書籍列表</a>
            <a href="/page/profile">會員資料</a>
            <a href="/page/orders">我的訂單</a>
            <a class="cart-link" href="/page/cart">購物車 <span id="cartCount" class="cart-count">0</span></a>
        </div>
    </div>
</header>

<main>
    <div id="message" class="message" hidden></div>

    <div id="content" hidden>
        <a class="back" href="/page/books">&larr; 回書籍列表</a>
        <article class="detail">
            <img id="cover" class="cover" alt="">
            <div class="info">
                <h2 id="name"></h2>
                <p id="tagline" class="tagline"></p>
                <p id="price" class="price"></p>
                <p id="status" class="status"></p>

                <div class="buy-row">
                    <label class="qty-label" for="quantity">數量</label>
                    <input id="quantity" class="qty-input" type="number" min="1" value="1" disabled>
                    <button id="addToCartButton" class="cart-button" type="button" disabled>加入購物車</button>
                    <button id="buyButton" class="buy-button" type="button" disabled>立即購買</button>
                    <span id="subtotal" class="subtotal"></span>
                </div>
                <p id="buyError" class="buy-error" role="alert" hidden></p>
                <p id="cartNotice" class="cart-notice" role="status" hidden></p>

                <h3>內容簡介</h3>
                <p id="summary"></p>

                <h3>內容特色</h3>
                <ul id="features"></ul>

                <h3>適合讀者</h3>
                <p id="audience"></p>

                <h3>書籍資訊</h3>
                <dl class="specs">
                    <dt>編號</dt>
                    <dd id="specId"></dd>
                    <dt>書名</dt>
                    <dd id="specName"></dd>
                    <dt>定價</dt>
                    <dd id="specPrice"></dd>
                </dl>
            </div>
        </article>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    function getAccessToken() { return localStorage.getItem("accessToken"); }
    function getRefreshToken() { return localStorage.getItem("refreshToken"); }

    // 後端若在 header 帶回新的 token，就存回 localStorage（與 books.html 相同）。
    function saveNewTokens(xhr) {
        const newAccessToken = xhr.getResponseHeader("X-New-Access-Token");
        const newRefreshToken = xhr.getResponseHeader("X-New-Refresh-Token");
        if (newAccessToken) { localStorage.setItem("accessToken", newAccessToken); }
        if (newRefreshToken) { localStorage.setItem("refreshToken", newRefreshToken); }
    }

    // 介紹文字目前寫在前端，key 是書籍 id。書名、價格、購買狀態改由後端 API 提供。
    // 簡介、特色、適合讀者是範例文字，請依實際內容修改。
    const BOOK_INFO = {
        1: {
            tagline: "入門首選，用最短的時間掌握基本觀念。",
            summary: "Book A 以淺顯的說明帶讀者認識核心概念，每一章都搭配簡短範例，讀完就能動手練習。適合想先建立整體輪廓、再往下深入的讀者。",
            features: ["章節短小，每章約十分鐘可讀完", "每章附帶練習題與解答", "圖解說明，減少文字負擔"],
            audience: "剛接觸這個主題、想從基礎開始學習的讀者。"
        },
        2: {
            tagline: "承接基礎，進一步整理常見問題與實作方法。",
            summary: "Book B 整理了實務上最常遇到的情境，從問題出發說明解法，並比較不同做法的優缺點。讀完後可以獨立處理大多數日常需求。",
            features: ["以實際問題為章節主軸", "收錄常見錯誤與排除方式", "附完整範例，可直接套用"],
            audience: "已有基礎、想把觀念運用到實際工作上的讀者。"
        },
        3: {
            tagline: "精選主題的專題讀本，內容精簡好上手。",
            summary: "本書聚焦單一主題，用清楚的步驟帶讀者從頭到尾完成一個小專案。篇幅精簡，適合利用零碎時間閱讀。",
            features: ["單一專題，步驟明確", "完成後可得到一份成果作品", "篇幅精簡，方便攜帶閱讀"],
            audience: "想用一本書完成一個小目標的讀者。"
        },
        4: {
            tagline: "完整系統的進階教材，兼顧原理與實作。",
            summary: "本書從原理講到實作，完整說明各個環節如何互相配合，並提供多個進階案例。適合想深入理解、而不只是照著做的讀者。",
            features: ["原理與實作並重", "收錄多個進階案例", "每章末附延伸閱讀方向"],
            audience: "想系統性學習並深入理解細節的讀者。"
        },
        5: {
            tagline: "完整收錄的珍藏版，適合長期參考。",
            summary: "本書是整套內容的完整版本，涵蓋基礎到進階的所有主題，並附上大量案例與速查表，適合放在手邊長期查閱。",
            features: ["完整涵蓋所有主題", "附速查表與索引", "大量案例，可作為工具書使用"],
            audience: "希望一次擁有完整內容、需要長期查閱的讀者。"
        }
    };

    // 後端有、但 BOOK_INFO 還沒寫介紹的書（例如之後新增的書），顯示這份預設內容。
    const DEFAULT_INFO = {
        tagline: "",
        summary: "這本書的介紹準備中。",
        features: [],
        audience: "準備中"
    };

    let currentBookId = null;
    let currentPrice = 0;
    let currentStock = 0;

    // 依選的數量更新小計金額。
    function updateSubtotal() {
        const quantity = parseInt($("#quantity").val(), 10);
        if (Number.isInteger(quantity) && quantity >= 1) {
            $("#subtotal").text("小計 NT$ " + (currentPrice * quantity).toLocaleString());
        } else {
            $("#subtotal").text("");
        }
    }

    $("#quantity").on("input", updateSubtotal);

    // 右上角購物車的總本數。
    function refreshCartCount() {
        const request = apiAjax({ url: "/cart", method: "GET" });
        if (!request) {
            return;
        }

        request.done(function (cart, textStatus, xhr) {
            saveNewTokens(xhr);
            $("#cartCount").text(cart.totalQuantity);
        });
    }

    // 加入購物車：把選的數量加進購物車（不會扣庫存，結帳時才扣）。
    $("#addToCartButton").on("click", function () {
        const button = $(this);
        $("#buyError").prop("hidden", true);
        $("#cartNotice").prop("hidden", true);

        const quantity = parseInt($("#quantity").val(), 10);
        if (!Number.isInteger(quantity) || quantity < 1 || quantity > currentStock) {
            $("#buyError").text(`請輸入 1 到 ${currentStock} 之間的數量`).prop("hidden", false);
            return;
        }

        button.prop("disabled", true).text("加入中");

        const request = apiAjax({
            url: "/cart/items",
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify({ bookId: Number(currentBookId), quantity: quantity })
        });
        if (!request) {
            return;
        }

        request
            .done(function (cart, textStatus, xhr) {
                saveNewTokens(xhr);
                $("#cartCount").text(cart.totalQuantity);
                $("#cartNotice")
                    .empty()
                    .append(document.createTextNode("已加入購物車。"))
                    .append($("<a>", { href: "/page/cart", text: "前往購物車" }))
                    .prop("hidden", false);
                button.prop("disabled", false).text("加入購物車");
            })
            .fail(function (xhr) {
                saveNewTokens(xhr);
                if (xhr.status === 401) {
                    window.location.href = "/page/login";
                    return;
                }

                const data = xhr.responseJSON || {};
                const firstError = data.errors && typeof data.errors === "object" ? Object.values(data.errors)[0] : null;
                const errorMessage = firstError || data.message || "加入購物車失敗";
                $("#buyError").text(errorMessage).prop("hidden", false);

                // 庫存不足：重新讀取最新庫存；其他錯誤允許稍後重試。
                if (errorMessage.includes("庫存不足")) {
                    findBook(currentBookId, 1);
                } else {
                    button.prop("disabled", false).text("加入購物車");
                }
            });
    });

    // 點擊購買：向後端建立訂單並取得藍新 MPG 表單資料（與書籍列表頁相同的 API）。
    $("#buyButton").on("click", function () {
        const button = $(this);
        const accessToken = getAccessToken();
        const refreshToken = getRefreshToken();

        if (!accessToken || !refreshToken) {
            window.location.href = "/page/login";
            return;
        }

        $("#buyError").prop("hidden", true);

        // 購買數量必須是 1 到庫存之間的整數。
        const quantity = parseInt($("#quantity").val(), 10);
        if (!Number.isInteger(quantity) || quantity < 1 || quantity > currentStock) {
            $("#buyError").text(`請輸入 1 到 ${currentStock} 之間的數量`).prop("hidden", false);
            return;
        }

        button.prop("disabled", true).text("購買中");

        $.ajax({
            url: `/payments/books/${currentBookId}/newebpay/form?quantity=${quantity}`,
            method: "POST",
            headers: {
                Authorization: `Bearer ${accessToken}`,
                "X-Refresh-Token": refreshToken
            },
            success: function (data, textStatus, xhr) {
                saveNewTokens(xhr);
                submitNewebPayForm(data);
            },
            error: function (xhr) {
                saveNewTokens(xhr);
                if (xhr.status === 401) {
                    window.location.href = "/page/login";
                    return;
                }

                const data = xhr.responseJSON || {};
                const bookError = data.errors && data.errors.book;
                const errorMessage = bookError || data.message || "建立付款資料失敗";

                $("#buyError").text(errorMessage).prop("hidden", false);

                // 庫存不足：重新讀取最新庫存（錯誤訊息會保留）；其他錯誤允許稍後重試。
                if (errorMessage.includes("庫存不足")) {
                    findBook(currentBookId, 1);
                } else {
                    button.prop("disabled", false).text("立即購買");
                }
            }
        });
    });

    // 藍新 MPG 需要瀏覽器用 form POST 導向 gateway。
    function submitNewebPayForm(paymentForm) {
        if (!paymentForm.gatewayUrl || !paymentForm.merchantId
                || !paymentForm.version || !paymentForm.tradeInfo || !paymentForm.tradeSha) {
            $("#buyError").text("付款表單資料不完整").prop("hidden", false);
            $("#buyButton").prop("disabled", false).text("購買");
            return;
        }

        const form = $("<form>", {
            method: "POST",
            action: paymentForm.gatewayUrl
        }).css("display", "none");

        const fields = {
            MerchantID: paymentForm.merchantId,
            Version: paymentForm.version,
            TradeInfo: paymentForm.tradeInfo,
            TradeSha: paymentForm.tradeSha
        };

        $.each(fields, function (name, value) {
            form.append($("<input>", { type: "hidden", name: name, value: value }));
        });

        form.appendTo(document.body);
        form.trigger("submit");
    }

    function showMessage(text) {
        $("#content").prop("hidden", true);
        $("#message").text(text).prop("hidden", false);
    }

    function renderBook(book) {
        const info = BOOK_INFO[book.id] || DEFAULT_INFO;
        const priceText = "NT$ " + Number(book.price).toLocaleString();
        const stock = Number(book.stock) || 0;
        const soldOut = stock < 1;
        const statusText = soldOut ? "已售完" : `尚有庫存 ${stock} 本`;

        document.title = book.name + "｜書籍介紹";
        $("#cover")
            .attr({ src: `/images/books/book-${book.id}.svg`, alt: `${book.name} 封面` })
            .on("error", function () { $(this).css("visibility", "hidden"); });
        $("#name").text(book.name);
        $("#tagline").text(info.tagline).prop("hidden", !info.tagline);
        $("#price").text(priceText);
        $("#status").text(statusText).toggleClass("unavailable", soldOut);
        currentBookId = book.id;
        currentPrice = Number(book.price);
        currentStock = stock;

        // 數量最多只能選到庫存數量；售完時停用。
        const quantityInput = $("#quantity");
        const currentQuantity = parseInt(quantityInput.val(), 10) || 1;
        quantityInput
            .attr("max", stock)
            .val(soldOut ? 1 : Math.min(Math.max(currentQuantity, 1), stock))
            .prop("disabled", soldOut);
        $("#buyButton")
            .prop("disabled", soldOut)
            .text(soldOut ? "已售完" : "立即購買");
        $("#addToCartButton").prop("disabled", soldOut);
        updateSubtotal();
        $("#summary").text(info.summary);
        $("#audience").text(info.audience);
        $("#specId").text(book.id);
        $("#specName").text(book.name);
        $("#specPrice").text(priceText);

        const list = $("#features").empty();
        info.features.forEach(function (feature) {
            $("<li>").text(feature).appendTo(list);
        });

        $("#content").prop("hidden", false);
    }

    // 與 books.html 相同：統一處理需要登入的 AJAX 請求，自動補上 access token 和 refresh token。
    function apiAjax(options) {
        const accessToken = getAccessToken();
        const refreshToken = getRefreshToken();

        if (!accessToken || !refreshToken) {
            window.location.href = "/page/login";
            return null;
        }

        const ajaxOptions = $.extend({}, options);
        ajaxOptions.headers = $.extend({}, options.headers || {}, {
            Authorization: `Bearer ${accessToken}`,
            "X-Refresh-Token": refreshToken
        });

        return $.ajax(ajaxOptions);
    }

    // 與 books.html 使用同一支 GET /books 列表 API，逐頁找出指定 id 的書。
    // 這樣不需要後端另外提供「單本書」的 API。
    function findBook(id, page) {
        const request = apiAjax({
            url: `/books?page=${page}&size=50`,
            method: "GET"
        });

        // apiAjax 回傳 null 代表沒有 token，已經導向登入頁。
        if (!request) {
            return;
        }

        request
            .done(function (data, textStatus, xhr) {
                saveNewTokens(xhr);

                const books = data.content || [];
                const book = books.find(function (item) {
                    return String(item.id) === String(id);
                });

                if (book) {
                    renderBook(book);
                    return;
                }

                // 這一頁沒有，且還有下一頁就繼續找；全部找完都沒有才顯示找不到。
                const totalPages = data.totalPages || 1;
                if (page < totalPages) {
                    findBook(id, page + 1);
                } else {
                    showMessage("找不到這本書的介紹");
                }
            })
            .fail(function (xhr) {
                saveNewTokens(xhr);
                if (xhr.status === 401) {
                    window.location.href = "/page/login";
                    return;
                }
                const data = xhr.responseJSON || {};
                showMessage(data.message || "讀取書籍失敗");
            });
    }

    $(function () {
        // 從網址取得書籍 id，例如 /page/book-detail?id=3
        const id = new URLSearchParams(window.location.search).get("id");

        if (!id || !/^\d+$/.test(id)) {
            showMessage("找不到這本書的介紹");
            return;
        }

        findBook(id, 1);
        refreshCartCount();
    });
</script>
</body>
</html>
