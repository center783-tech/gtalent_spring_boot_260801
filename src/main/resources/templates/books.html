<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>書籍列表</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, "Noto Sans TC", sans-serif;
            background: #f4f6f8;
            color: #1f2933;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #d9e2ec;
        }

        .bar {
            width: min(1080px, calc(100vw - 32px));
            margin: 0 auto;
            padding: 18px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        h1 {
            margin: 0;
            font-size: 26px;
        }

        main {
            width: min(1080px, calc(100vw - 32px));
            margin: 28px auto;
            background: #ffffff;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px 16px;
            border-bottom: 1px solid #edf2f7;
            text-align: left;
        }

        th {
            background: #f8fafc;
            font-size: 14px;
            color: #52606d;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        .price {
            text-align: right;
        }

        .action {
            width: 200px;
            text-align: center;
            white-space: nowrap;
        }

        .stock {
            width: 72px;
            text-align: right;
        }

        .qty-input {
            width: 56px;
            margin-right: 8px;
            padding: 9px 6px;
            border: 1px solid #bcccdc;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
        }

        .qty-input:disabled {
            background: #f1f5f9;
            color: #94a3b8;
        }

        button {
            padding: 10px 14px;
            border: 1px solid #bcccdc;
            border-radius: 6px;
            background: #ffffff;
            color: #1f2933;
            font-weight: 700;
            cursor: pointer;
        }

        .buy-button {
            min-width: 88px;
            border-color: #2563eb;
            background: #2563eb;
            color: #ffffff;
        }

        .buy-button:disabled {
            cursor: not-allowed;
            border-color: #cbd5e1;
            background: #e2e8f0;
            color: #64748b;
        }

        .message {
            padding: 32px;
            text-align: center;
            color: #627d98;
        }

        .error {
            color: #9b1c1c;
        }

        .pager {
            padding: 14px 16px;
            border-top: 1px solid #edf2f7;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            background: #ffffff;
        }

        .pager select {
            padding: 9px 10px;
            border: 1px solid #bcccdc;
            border-radius: 6px;
            background: #ffffff;
            color: #1f2933;
        }

        .pager button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }

        #pageInfo {
            min-width: 120px;
            text-align: center;
            color: #52606d;
            font-weight: 700;
        }

        .book-link {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: #1769aa;
            font-weight: 700;
            text-decoration: none;
        }

        .book-link:hover {
            text-decoration: underline;
        }

        .book-link:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 2px;
            border-radius: 4px;
        }

        .book-thumb {
            width: 36px;
            height: 48px;
            object-fit: cover;
            border-radius: 3px;
            border: 1px solid #d9e2ec;
            background: #e2e8f0;
        }

        .bar-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .cart-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #1769aa;
            font-weight: 700;
            text-decoration: none;
        }

        .cart-link:hover {
            text-decoration: underline;
        }

        .cart-count {
            min-width: 20px;
            padding: 1px 6px;
            border-radius: 999px;
            background: #2563eb;
            color: #ffffff;
            font-size: 12px;
            text-align: center;
        }

        .success {
            color: #0b6b3a;
        }
    </style>
</head>
<body>
<header>
    <div class="bar">
        <h1>書籍列表</h1>
        <div class="bar-actions">
            <a class="cart-link" href="/page/cart">購物車 <span id="cartCount" class="cart-count">0</span></a>
            <button id="logoutButton" type="button">登出</button>
        </div>
    </div>
</header>

<main>
    <div id="message" class="message">讀取中</div>
    <table id="booksTable" hidden>
        <thead>
        <tr>
            <th>ID</th>
            <th>書名</th>
            <th class="price">價格</th>
            <th class="stock">庫存</th>
            <th class="action">購買</th>
        </tr>
        </thead>
        <tbody id="booksBody"></tbody>
    </table>
    <div id="pager" class="pager" hidden>
        <label for="pageSize">每頁</label>
        <select id="pageSize">
            <option value="5">5 筆</option>
            <option value="10" selected>10 筆</option>
            <option value="20">20 筆</option>
            <option value="50">50 筆</option>
        </select>
        <button id="prevPage" type="button">上一頁</button>
        <span id="pageInfo">第 1 / 1 頁</span>
        <button id="nextPage" type="button">下一頁</button>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    // currentPage 記錄目前正在看的頁碼；進入頁面時預設從第 1 頁開始。
    let currentPage = 1;

    // totalPages 記錄後端回傳的總頁數，用來判斷「下一頁」是否還能點。
    let totalPages = 1;

    // 購買失敗後會重新讀取列表（更新庫存），這個變數用來讓錯誤訊息在列表重畫後仍然顯示。
    let pendingError = null;

    // 從瀏覽器的 localStorage 取出 access token。
    // access token 會放在 Authorization header，讓後端知道目前使用者是誰。
    function getAccessToken() {
        return localStorage.getItem("accessToken");
    }

    // 從瀏覽器的 localStorage 取出 refresh token。
    // refresh token 會送到後端，讓後端在 access token 快過期時可以補發新 token。
    function getRefreshToken() {
        return localStorage.getItem("refreshToken");
    }

    // 有些 API 回應會在 header 帶回新的 token。
    // 如果有新的 token，就立刻存回 localStorage，之後的請求才會使用最新憑證。
    function saveNewTokens(xhr) {
        const newAccessToken = xhr.getResponseHeader("X-New-Access-Token");
        const newRefreshToken = xhr.getResponseHeader("X-New-Refresh-Token");

        if (newAccessToken) {
            localStorage.setItem("accessToken", newAccessToken);
        }

        if (newRefreshToken) {
            localStorage.setItem("refreshToken", newRefreshToken);
        }
    }

    // 清除登入憑證。通常會在登出、token 不存在或登入狀態失效時使用。
    function clearTokens() {
        localStorage.removeItem("accessToken");
        localStorage.removeItem("refreshToken");
    }

    // 統一處理需要登入的 AJAX 請求。
    // 呼叫這個函式時，只要傳入原本 $.ajax 需要的 options，
    // 這裡會自動補上 access token 和 refresh token。
    function apiAjax(options) {
        const accessToken = getAccessToken();
        const refreshToken = getRefreshToken();

        // 如果瀏覽器裡沒有 token，代表使用者尚未登入或資料已被清掉。
        // 這時不呼叫 API，直接導回登入頁。
        if (!accessToken || !refreshToken) {
            window.location.href = "/page/login";
            return null;
        }

        const ajaxOptions = $.extend({}, options);
        ajaxOptions.headers = $.extend({}, options.headers || {}, {
            Authorization: `Bearer ${accessToken}`,
            "X-Refresh-Token": refreshToken
        });

        return $.ajax(ajaxOptions);
    }

    // 向後端取得書籍列表。
    // currentPage 決定目前頁碼，pageSize 決定每頁顯示幾筆。
    function loadBooks() {
        const pageSize = $("#pageSize").val();

        // On every books-page reload, refresh only stale pending payments on the server.
        const paymentQuery = apiAjax({
            url: "/payments/newebpay/query-pending",
            method: "GET"
        });
        if (paymentQuery) {
            paymentQuery.done(function (data, textStatus, xhr) {
                saveNewTokens(xhr);
            });
        }

        const request = apiAjax({
            url: `/books?page=${currentPage}&size=${pageSize}`,
            method: "GET"
        });

        // apiAjax 回傳 null 代表沒有 token，已經導向登入頁，這裡不再往下做。
        if (!request) {
            return;
        }

        request
            .done(function (data, textStatus, xhr) {
                // 每次成功呼叫 API 後，都檢查後端是否順便發了新 token。
                saveNewTokens(xhr);

                // 後端回傳的 page / totalPages 會作為畫面與按鈕狀態的依據。
                currentPage = data.page || currentPage;
                totalPages = data.totalPages || 1;

                // content 是目前這一頁的書籍資料；若沒有資料就給空陣列。
                renderBooks(data.content || []);
                renderPager(data);
            })
            .fail(function (xhr) {
                // API 失敗時顯示錯誤訊息，並隱藏表格與分頁，避免畫面留下舊資料。
                const data = xhr.responseJSON || {};
                $("#message").text(data.message || "讀取書籍失敗").addClass("error").prop("hidden", false);
                $("#booksTable").prop("hidden", true);
                $("#pager").prop("hidden", true);
            });
    }

    // 把書籍資料畫到 HTML 表格裡。
    // books 是陣列，每一個 book 物件都會變成一列 <tr>。
    function renderBooks(books) {
        const body = $("#booksBody");

        // 先清空舊資料，避免切換頁面時新舊資料混在一起。
        body.empty();

        if (books.length === 0) {
            // 沒有資料時顯示提示文字，並把表格與分頁藏起來。
            $("#message").text("目前沒有書籍資料").removeClass("error").prop("hidden", false);
            $("#booksTable").prop("hidden", true);
            $("#pager").prop("hidden", true);
            return;
        }

        books.forEach(function (book) {
            // 庫存為 0 就顯示已售完；有庫存時買家可以先選數量，最多只能選到庫存數量。
            const stock = Number(book.stock) || 0;
            const soldOut = stock < 1;
            const qtyInput = $("<input>", {
                type: "number",
                class: "qty-input",
                min: 1,
                max: stock,
                value: 1,
                disabled: soldOut,
                "aria-label": book.name + " 購買數量"
            });
            const buyButton = $("<button>", {
                type: "button",
                class: "buy-button",
                text: soldOut ? "已售完" : "加入購物車",
                disabled: soldOut
            }).attr("data-book-id", book.id);

            // 書名做成連結，點進去會前往這本書的介紹頁。
            // 縮圖載入失敗時（例如該書還沒有圖片）就隱藏圖片，只留下書名。
            const thumb = $("<img>", {
                class: "book-thumb",
                src: `/images/books/book-${book.id}.svg`,
                alt: ""
            }).on("error", function () {
                $(this).hide();
            });
            const bookLink = $("<a>", {
                class: "book-link",
                href: `/page/book-detail?id=${encodeURIComponent(book.id)}`
            }).append(thumb).append($("<span>").text(book.name));

            // 使用 jQuery 建立 <tr> 和 <td>，再把文字放進每個欄位。
            // .text(...) 會把內容當成純文字，可以避免 HTML 被直接插入頁面。
            $("<tr>")
                .append($("<td>").text(book.id))
                .append($("<td>").append(bookLink))
                .append($("<td>").addClass("price").text(book.price))
                .append($("<td>").addClass("stock").text(stock))
                .append($("<td>").addClass("action").append(qtyInput).append(buyButton))
                .appendTo(body);
        });

        // 有資料時隱藏訊息區，並顯示書籍表格。
        // 如果剛才購買失敗，列表重畫後還是要讓使用者看到原因；否則隱藏訊息區。
        if (pendingError) {
            $("#message").text(pendingError).removeClass("success").addClass("error").prop("hidden", false);
            pendingError = null;
        } else {
            $("#message").prop("hidden", true);
        }
        $("#booksTable").prop("hidden", false);
    }

    // 在列表上方顯示訊息：成功是綠色，失敗是紅色。
    function showListMessage(text, isError) {
        $("#message").text(text).toggleClass("error", isError).toggleClass("success", !isError).prop("hidden", false);
    }

    // 右上角購物車的總本數。
    function refreshCartCount() {
        const request = apiAjax({ url: "/cart", method: "GET" });
        if (!request) {
            return;
        }

        request.done(function (cart, textStatus, xhr) {
            saveNewTokens(xhr);
            $("#cartCount").text(cart.totalQuantity);
        });
    }

    // 點擊「加入購物車」：把這一列選的數量加進購物車（不會扣庫存，結帳時才扣）。
    $("#booksBody").on("click", ".buy-button", function () {
        const button = $(this);
        const bookId = Number(button.attr("data-book-id"));

        // 取得這一列選的數量，必須是 1 到庫存之間的整數。
        const qtyInput = button.closest("tr").find(".qty-input");
        const quantity = parseInt(qtyInput.val(), 10);
        const maxQuantity = parseInt(qtyInput.attr("max"), 10);
        if (!Number.isInteger(quantity) || quantity < 1 || quantity > maxQuantity) {
            showListMessage(`請輸入 1 到 ${maxQuantity} 之間的數量`, true);
            return;
        }

        button.prop("disabled", true).text("加入中");

        const request = apiAjax({
            url: "/cart/items",
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify({ bookId: bookId, quantity: quantity })
        });
        if (!request) {
            return;
        }

        request
            .done(function (cart, textStatus, xhr) {
                saveNewTokens(xhr);
                $("#cartCount").text(cart.totalQuantity);
                showListMessage("已加入購物車", false);
                button.prop("disabled", false).text("加入購物車");
            })
            .fail(function (xhr) {
                saveNewTokens(xhr);
                if (xhr.status === 401) {
                    window.location.href = "/page/login";
                    return;
                }

                const data = xhr.responseJSON || {};
                const firstError = data.errors && typeof data.errors === "object" ? Object.values(data.errors)[0] : null;
                const errorMessage = firstError || data.message || "加入購物車失敗";

                // 庫存不足：重新讀取列表顯示最新庫存；其他錯誤允許使用者稍後重試。
                if (errorMessage.includes("庫存不足")) {
                    pendingError = errorMessage;
                    loadBooks();
                } else {
                    showListMessage(errorMessage, true);
                    button.prop("disabled", false).text("加入購物車");
                }
            });
    });

    // 更新分頁區塊的文字與按鈕狀態。
    function renderPager(data) {
        const page = data.page || 1;
        const total = data.totalPages || 1;
        const totalElements = data.totalElements || 0;

        $("#pageInfo").text(`第 ${page} / ${total} 頁，共 ${totalElements} 筆`);

        // 第一頁不能再往前，所以停用「上一頁」。
        $("#prevPage").prop("disabled", page <= 1);

        // 最後一頁不能再往後，所以停用「下一頁」。
        $("#nextPage").prop("disabled", page >= total);
        $("#pager").prop("hidden", false);
    }

    // 點「上一頁」時，頁碼減 1，再重新向後端取得資料。
    $("#prevPage").on("click", function () {
        if (currentPage <= 1) {
            return;
        }

        currentPage -= 1;
        loadBooks();
    });

    // 點「下一頁」時，頁碼加 1，再重新向後端取得資料。
    $("#nextPage").on("click", function () {
        if (currentPage >= totalPages) {
            return;
        }

        currentPage += 1;
        loadBooks();
    });

    // 使用者改變每頁筆數時，回到第 1 頁重新查詢。
    // 這樣可以避免原本頁碼超過新的總頁數。
    $("#pageSize").on("change", function () {
        currentPage = 1;
        loadBooks();
    });

    // 點「登出」時，通知後端讓 refresh token 失效。
    // 不管後端回應成功或失敗，前端最後都會清除 token 並回到登入頁。
    $("#logoutButton").on("click", function () {
        const refreshToken = getRefreshToken();

        // 如果前端已經沒有 refresh token，就直接清除本地資料並回登入頁。
        if (!refreshToken) {
            clearTokens();
            window.location.href = "/page/login";
            return;
        }

        $.ajax({
            url: "/members/logout",
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify({ refreshToken }),
            complete: function () {
                clearTokens();
                window.location.href = "/page/login";
            }
        });
    });

    // 頁面載入完成後自動執行 loadBooks，取得第一頁書籍資料。
    $(function () {
        loadBooks();
        refreshCartCount();
    });
</script>
</body>
</html>
